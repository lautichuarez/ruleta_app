<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>¿Qué hacemos hoy?</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d1b69">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fondo-emojis" aria-hidden="true">
    <img src="emoji1.png" alt="" style="top:6%;  left:3%;  --d:0s;">
    <img src="emoji2.png" alt="" style="top:14%; left:76%; --d:1.2s;">
    <img src="emoji3.png" alt="" style="top:40%; left:82%; --d:2.4s;">
    <img src="emoji4.png" alt="" style="top:60%; left:4%;  --d:0.6s;">
    <img src="emoji5.png" alt="" style="top:76%; left:62%; --d:1.8s;">
    <img src="emoji6.png" alt="" style="top:88%; left:18%; --d:3s;">
  </div>

  <main>
    <header class="encabezado">
      <img src="icon-192.png" alt="" class="logo">
      <h1>¿Qué hacemos hoy?</h1>
    </header>

    <button id="btnInstalar" class="btn-instalar" hidden>📲 Descargar app</button>

    <section class="tarjeta ruleta-seccion">
      <div class="ruleta-wrapper">
        <div class="puntero"></div>
        <canvas id="ruleta" width="600" height="600"></canvas>
      </div>
      <button id="btnGirar" class="btn-girar">¡Girar!</button>
      <p id="resultado" class="resultado"></p>
    </section>

    <section class="tarjeta">
      <h2>Opciones</h2>
      <div class="agregar">
        <input id="nuevaOpcion" type="text" placeholder="Escribe una opción..." maxlength="25">
        <button id="btnAgregar" class="btn-agregar">+</button>
      </div>
      <ul id="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
