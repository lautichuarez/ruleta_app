<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>¿Qué hacemos hoy?</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f86e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fondo-emojis" aria-hidden="true"></div>
  <canvas id="confeti" aria-hidden="true"></canvas>

  <!-- Menú de inicio -->
  <section id="pantallaInicio" class="inicio">
    <img src="icon-192.png" alt="" class="inicio-logo">
    <h1 class="inicio-titulo">¿Qué hacemos hoy?</h1>
    <p class="inicio-sub">Deja que la ruleta decida por ti</p>

    <div id="menuPrincipal" class="inicio-botones">
      <button id="btnJugar" class="btn-inicio btn-inicio-principal" style="--i:0">🎡 Jugar</button>
      <button id="btnModoGrupo" class="btn-inicio" style="--i:1">👥 Modo grupo</button>
      <button id="btnDesafio" class="btn-inicio" style="--i:2">🎲 Modo desafío</button>
      <button id="btnCompartirApp" class="btn-inicio" style="--i:3">📤 Compartir la app</button>
    </div>

    <div id="menuDesafio" class="inicio-botones" hidden>
      <p class="inicio-sub">Elige un desafío</p>
      <button class="btn-inicio" data-plantilla="Qué comemos hoy" style="--i:0">🍕 ¿Qué comemos hoy?</button>
      <button class="btn-inicio" data-plantilla="Quién paga" style="--i:1">💸 ¿Quién paga la cuenta?</button>
      <button class="btn-inicio" data-plantilla="Previa" style="--i:2">🎉 Previa / Fiesta</button>
      <button id="btnVolverMenu" class="btn-inicio" style="--i:3">← Volver</button>
    </div>
  </section>

  <main>
    <header class="encabezado">
      <img src="icon-192.png" alt="" class="logo">
      <h1>¿Qué hacemos hoy?</h1>
      <div class="acciones">
        <button id="btnMenu" class="btn-tema" title="Menú">🏠</button>
        <button id="btnTema" class="btn-tema" title="Cambiar tema">🌙</button>
      </div>
    </header>

    <button id="btnInstalar" class="btn-instalar" hidden>📲 Descargar app</button>

    <section class="tarjeta ruleta-seccion">
      <div class="barra-listas">
        <select id="selectorLista" aria-label="Elegir lista"></select>
        <button id="btnNuevaLista" class="btn-lista" title="Nueva lista">＋</button>
        <button id="btnBorrarLista" class="btn-lista" title="Borrar lista">🗑</button>
      </div>

      <div class="ruleta-wrapper">
        <div class="puntero"></div>
        <canvas id="ruleta" width="600" height="600"></canvas>
      </div>
      <button id="btnGirar" class="btn-girar">¡Girar!</button>
      <p id="resultado" class="resultado"></p>
      <button id="btnCompartir" class="btn-compartir" hidden>📲 Compartir en WhatsApp</button>
    </section>

    <section class="tarjeta">
      <h2>Opciones</h2>
      <div class="agregar">
        <input id="nuevaOpcion" type="text" placeholder="Escribe una opción..." maxlength="25">
        <button id="btnAgregar" class="btn-agregar">+</button>
      </div>
      <ul id="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
